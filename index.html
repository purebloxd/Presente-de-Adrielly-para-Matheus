<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o Meu Amor</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow-x:hidden;

background:linear-gradient(
270deg,
#f3e5f5,
#e1bee7,
#ce93d8,
#ba68c8,
#ab47bc
);

background-size:1000% 1000%;
animation:gradiente 20s ease infinite;
}

@keyframes gradiente{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
max-width:450px;
width:90%;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
text-align:center;
position:relative;
z-index:2;
}

.polaroid{
background:white;
padding:10px 10px 35px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transform:rotate(-2deg);
margin-bottom:20px;
}

.polaroid img{
width:100%;
border-radius:5px;
max-height:380px;
object-fit:cover;
}

.btn{
background:linear-gradient(45deg,#ba68c8,#9c27b0);
color:white;
border:none;
padding:16px;
border-radius:40px;
width:100%;
font-weight:bold;
cursor:pointer;
font-size:1.1rem;
box-shadow:0 5px 20px rgba(156,39,176,0.5);
transition:all .3s;
}

.btn:hover{
transform:scale(1.08) rotate(-1deg);
box-shadow:0 10px 30px rgba(156,39,176,0.7);
}

#mensagem{
display:none;
margin-top:20px;
padding:15px;
background:#fdf7ff;
border-radius:15px;
border:1px solid #e1bee7;
color:#7b1fa2;
}

.particula{
position:fixed;
font-size:22px;
pointer-events:none;
z-index:1;
}

.tela-inicial{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#ab47bc;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:10;
}

</style>
</head>

<body>

<div class="tela-inicial" id="tela">

<h1>💌 Uma surpresa pra você</h1>
<button class="btn" onclick="abrirSite()">Abrir</button>

</div>

<audio id="musica" preload="auto" loop>
<source src="./musica.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div class="polaroid">
<img src="./foto.jpg">
</div>

<h2 style="color:#8e24aa">Feliz 1 ano e 2 meses ❤️</h2>

<p style="font-weight:bold;color:#7b1fa2">
Estamos juntos há<br>
<span id="contador"></span>
</p>

<p style="color:#555">
Desde aquele Halloween de 2024, quando nos conhecemos,
minha vida ficou completa com você.
</p>

<button class="btn" onclick="surpresa()">Ver surpresa ❤️</button>

<div id="mensagem"></div>

</div>

<script>

const inicio = new Date("2025-01-12T00:00:00");

function atualizarContador(){

const agora = new Date();

const diff = agora - inicio;

const dias = Math.floor(diff/(1000*60*60*24));

document.getElementById("contador").innerHTML =
`${dias} dias juntos ❤️`;

}

setInterval(atualizarContador,1000);
atualizarContador();

const frases=[

"Didy e Teteu, Teteu e Didy ❤️",
"1 ano e 2 meses sendo o casal mais incrível do mundo.",
"Obrigada por ser meu parceiro desde aquela festa.",
"Ainda bem que te encontrei agora tenho você ❤️",
"Você é meu porto seguro.",
"Com você até os dias comuns viram especiais.",
"Se eu pudesse escolher de novo, escolheria você mil vezes.",
"Nosso amor é minha parte favorita da vida.",
"Amar você é a coisa mais fácil que já fiz.",
"Obrigada por fazer minha vida mais feliz.",
"Nosso amor é a minha história favorita.",
"Você transforma qualquer momento em memória.",
"Eu escolheria você em todas as vidas.",
"Nosso amor é a melhor coincidência da minha vida.",
"Você é meu sorriso favorito.",
"Meu coração sempre encontra o seu.",
"Te amar é minha coisa preferida.",
"Você é a melhor parte dos meus dias.",
"Com você tudo faz sentido.",
"Meu mundo ficou mais bonito depois que você chegou.",
"Você é minha pessoa favorita.",
"Nosso amor merece mil comemorações.",
"Eu amo a vida que tenho com você.",
"Obrigada por ser exatamente quem você é.",
"Cada segundo com você vale a pena.",
"Eu amo ser nós dois."

];

function abrirSite(){

document.getElementById("tela").style.display="none";

const musica=document.getElementById("musica");

musica.currentTime=0;
musica.play().catch(()=>{});

}

function surpresa(){

const frase=frases[Math.floor(Math.random()*frases.length)];

const caixa=document.getElementById("mensagem");

caixa.innerText=frase;

caixa.style.display="block";

explodirAmor();

}

function explodirAmor(){

for(let i=0;i<60;i++){

const p=document.createElement("div");

p.innerHTML=Math.random()>0.5?"❤️":"💜";

p.className="particula";

p.style.left="50%";
p.style.top="50%";

document.body.appendChild(p);

let angulo=Math.random()*Math.PI*2;
let velocidade=5+Math.random()*12;

let vx=Math.cos(angulo)*velocidade;
let vy=Math.sin(angulo)*velocidade;

let x=window.innerWidth/2;
let y=window.innerHeight/2;

let op=1;

const loop=setInterval(()=>{

x+=vx;
y+=vy;

vy+=0.3;

op-=0.02;

p.style.left=x+"px";
p.style.top=y+"px";
p.style.opacity=op;

if(op<=0){

clearInterval(loop);
p.remove();

}

},25);

}

}

function criarParticula(){

const tipos=["❤️","💜","⭐"];

const p=document.createElement("div");

p.className="particula";

p.innerHTML=tipos[Math.floor(Math.random()*tipos.length)];

document.body.appendChild(p);

let x=Math.random()*window.innerWidth;
let y=-20;

p.style.left=x+"px";
p.style.top=y+"px";

let vel=2+Math.random()*3;

const loop=setInterval(()=>{

y+=vel;

p.style.top=y+"px";

if(y>window.innerHeight){

clearInterval(loop);
p.remove();

}

},25);

}

setInterval(()=>{

criarParticula();

},900);

</script>

</body>
</html>
