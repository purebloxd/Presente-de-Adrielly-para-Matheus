<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">

<title>Nossa História ❤️</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
text-align:center;
overflow-x:hidden;
color:#333;

background:linear-gradient(270deg,#7b1fa2,#ce93d8,#90caf9,#f48fb1);
background-size:800% 800%;
animation:fundo 18s ease infinite;
}

@keyframes fundo{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.container{
max-width:450px;
margin:auto;
padding:20px;
background:white;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
margin-top:40px;
}

img{
width:100%;
border-radius:12px;
}

.frase{
margin-top:10px;
font-style:italic;
color:#7b1fa2;
}

.btn{
background:linear-gradient(45deg,#ba68c8,#ec407a);
border:none;
padding:15px;
border-radius:40px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

#mensagem{
margin-top:20px;
display:none;
font-weight:bold;
color:#7b1fa2;
min-height:40px;
}

.carrossel{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin:20px 0;
}

.carrossel-container{
width:250px;
overflow:hidden;
border-radius:12px;
}

.carrossel-track{
display:flex;
transition:transform .6s ease;
}

.carrossel-track img{
width:250px;
flex-shrink:0;
}

.timeline{
margin-top:40px;
}

.timeline-item{
margin-bottom:40px;
}

.timeline-item img{
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.data{
font-weight:bold;
color:#8e24aa;
margin-top:10px;
}

/* ENVELOPE ROXO MISTERIOSO */
.tela-inicial{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#000;
z-index:9999;
transition: opacity 1.5s;
}

.envelope{
width:320px;
height:220px;
background:#7b1fa2;
border-radius:0 0 15px 15px;
position:relative;
cursor:pointer;
box-shadow: 0 20px 40px rgba(0,0,0,0.5);
overflow: hidden;
}

.envelope::before {
content: '';
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
background: #6a1b9a;
clip-path: polygon(0 35%, 50% 100%, 100% 35%, 100% 100%, 0 100%);
z-index: 4;
pointer-events: none; /* Deixa o clique passar para o envelope */
}

.tampa{
position:absolute;
width:100%;
height:120px;
top: 0;
left: 0;
background:#8e24aa;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;
z-index:5;
border-radius: 15px 15px 0 0;
pointer-events: none;
}

.carta{
position:absolute;
width:280px;
height:160px;
background:white;
top:30px;
left:20px;
border-radius:10px;
display:flex;
flex-direction: column;
align-items:center;
justify-content:center;
font-weight:bold;
font-size: 1.2rem;
color: #7b1fa2;
z-index:2;
transition: 1s;
}

.envelope.abrir {
overflow: visible;
}

.envelope.abrir .tampa{
transform:rotateX(180deg);
z-index: 1;
}

.envelope.abrir .carta{
transform:translateY(-150px);
z-index: 6;
}

</style>
</head>
