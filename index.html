<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            overflow-x: hidden;
            background: linear-gradient(270deg, #7b1fa2, #ce93d8, #90caf9, #f48fb1);
            background-size: 400% 400%;
            animation: fundoAnimado 15s ease infinite;
        }

        @keyframes fundoAnimado {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        /* ESTILO DO BALÃO DE FESTA */
        .balao-festa {
            position: fixed;
            width: 100px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #ba68c8, #7b1fa2);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            z-index: 1;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: flutuarBalao 12s ease-in-out infinite;
            pointer-events: none;
        }
        .balao-festa::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 2px;
            height: 50px;
            background: rgba(255,255,255,0.4);
        }

        @keyframes flutuarBalao {
            0% { bottom: -150px; left: 10%; opacity: 0; }
            10% { opacity: 1; }
            50% { left: 80%; bottom: 60%; }
            100% { bottom: 110%; left: 30%; opacity: 0; }
        }

        /* TELA INICIAL / ENVELOPE */
        .tela-inicial {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s;
        }

        .envelope-wrapper { position: relative; width: 300px; height: 200px; cursor: pointer; }
        .envelope { width: 100%; height: 100%; background: #7b1fa2; border-radius: 0 0 15px 15px; position: relative; }
        .envelope::before {
            content: ''; position: absolute; inset: 0; background: #6a1b9a;
            clip-path: polygon(0 35%, 50% 100%, 100% 35%, 100% 100%, 0 100%); z-index: 4;
        }
        .tampa {
            position: absolute; width: 100%; height: 110px; top: 0; background: #8e24aa;
            clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: 0.8s; z-index: 5;
        }
        .carta {
            position: absolute; inset: 20px; background: #fff; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: #7b1fa2; font-weight: bold; z-index: 2; transition: 1s;
        }

        .abrir .tampa { transform: rotateX(180deg); z-index: 1; }
        .abrir .carta { transform: translateY(-130px); z-index: 6; }

        /* CONTEÚDO PRINCIPAL */
        .container {
            max-width: 400px; margin: 50px auto; padding: 20px;
            background: rgba(255, 255, 255, 0.95); border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; z-index: 10;
        }
        .carrossel-track img { width: 250px; border-radius: 10px; }
        .btn { background: linear-gradient(45deg, #ba68c8, #ec407a); border: none; padding: 12px 25px; color: #fff; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="space"></canvas>
    <div class="balao-festa">Teteu e Didy ❤️</div>

    <div class="tela-inicial" id="tela" onclick="abrirCarta()">
        <div class="envelope-wrapper" id="env_wrap">
            <div class="envelope" id="env">
                <div class="tampa"></div>
                <div class="carta">
                    <p>Abrir 💌</p>
                    <small>Para: Teteu</small>
                </div>
            </div>
        </div>
    </div>

    <audio id="musica" loop>
        <source src="https://files.catbox.moe/4sunlu.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h2>Feliz 1 ano e 2 meses ❤️</h2>
        <p>Estamos juntos há <strong id="contador" style="color:#7b1fa2"></strong></p>
        
        <div style="margin: 20px 0;">
            <div id="track" style="overflow:hidden; width: 250px; margin: auto;">
                <img src="fotos/foto.jpg" style="width:100%">
            </div>
        </div>

        <button class="btn" id="botao">Ver surpresa ❤️</button>
        <div id="mensagem" style="margin-top:15px; font-weight:bold; color:#7b1fa2"></div>
    </div>

    <script>
        // Contador
        const inicio = new Date(2025, 0, 12);
        function atualizarContador() {
            const dias = Math.floor((new Date() - inicio) / (1000 * 60 * 60 * 24));
            document.getElementById("contador").innerText = dias + " dias";
        }
        setInterval(atualizarContador, 1000);
        atualizarContador();

        // Abrir Carta
        function abrirCarta() {
            const env = document.getElementById("env_wrap");
            const musica = document.getElementById("musica");
            if(env.classList.contains("abrir")) return;
            
            env.classList.add("abrir");
            musica.play().catch(() => console.log("Interaja para tocar"));

            setTimeout(() => {
                document.getElementById("tela").style.opacity = "0";
                setTimeout(() => document.getElementById("tela").style.display = "none", 1000);
            }, 2000);
        }

        // Chuva de Corações e Estrelas (MASSIVA)
        function criarChuva() {
            const itens = ["❤️", "💜", "✨", "⭐"];
            const item = document.createElement("div");
            item.innerHTML = itens[Math.floor(Math.random() * itens.length)];
            item.style.position = "fixed";
            item.style.left = Math.random() * 100 + "vw";
            item.style.top = "-20px";
            item.style.fontSize = Math.random() * 15 + 10 + "px";
            item.style.zIndex = "5";
            item.style.pointerEvents = "none";
            document.body.appendChild(item);

            let pos = -20;
            const vel = Math.random() * 3 + 2;
            function cair() {
                pos += vel;
                item.style.top = pos + "px";
                if (pos < window.innerHeight) {
                    requestAnimationFrame(cair);
                } else {
                    item.remove();
                }
            }
            cair();
        }
        setInterval(criarChuva, 150); // Frequência rápida

        // Estrela Cadente
        function estrelaCadente() {
            const e = document.createElement("div");
            e.style.position = "fixed";
            e.style.width = "2px";
            e.style.height = "50px";
            e.style.background = "white";
            e.style.left = Math.random() * 100 + "vw";
            e.style.top = "-50px";
            e.style.transform = "rotate(45deg)";
            e.style.opacity = "0.7";
            document.body.appendChild(e);

            e.animate([
                { top: "-50px", transform: "translateX(0) rotate(45deg)" },
                { top: "100vh", transform: "translateX(-300px) rotate(45deg)" }
            ], { duration: 1500 });
            setTimeout(() => e.remove(), 1500);
        }
        setInterval(estrelaCadente, 3000);

        // Mensagens do Botão
        const frases = ["Didy e Teteu ❤️", "Meu lugar favorito é você", "Para sempre!", "Te amo mais que tudo"];
        document.getElementById("botao").onclick = () => {
            document.getElementById("mensagem").innerText = frases[Math.floor(Math.random() * frases.length)];
        };
    </script>
</body>
</html>
