<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossa História ❤️</title>

<style>
/* Reset básico para evitar espaços em branco */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow-x: hidden;
    background: #000; /* Começa preto para a surpresa */
    color: #333;
    min-height: 100vh;
}

/* O gradiente só aparece no fundo real do site */
.bg-site {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(270deg, #7b1fa2, #ce93d8, #90caf9, #f48fb1);
    background-size: 400% 400%;
    animation: fundoAnim 15s ease infinite;
    z-index: -2;
    opacity: 0; /* Escondido no início */
    transition: opacity 2s;
}

@keyframes fundoAnim {
    0% { background-position: 0% 50% }
    50% { background-position: 100% 50% }
    100% { background-position: 0% 50% }
}

canvas { position: fixed; top: 0; left: 0; z-index: -1; }

/* Conteúdo principal do site */
.container {
    max-width: 450px;
    margin: 40px auto;
    padding: 25px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    opacity: 0; /* Escondido até abrir a carta */
    transform: translateY(20px);
    transition: all 2s;
}

.visible { opacity: 1 !important; transform: translateY(0) !important; }

/* Estilos de imagem e botões */
img { width: 100%; border-radius: 15px; margin-bottom: 10px; }
.frase { font-style: italic; color: #7b1fa2; margin: 15px 0; }
.btn {
    background: linear-gradient(45deg, #ba68c8, #ec407a);
    border: none; padding: 15px 30px; border-radius: 50px;
    color: white; font-weight: bold; cursor: pointer;
}

/* TELA DE BLOQUEIO (ENVELOPE) */
.tela-inicial {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    display: flex; justify-content: center; align-items: center;
    z-index: 9999;
    transition: opacity 1.5s;
}

.envelope {
    width: 300px; height: 200px;
    background: #ec407a; border-radius: 15px;
    position: relative; cursor: pointer;
}

.tampa {
    position: absolute; width: 100%; height: 100%;
    background: #f06292; clip-path: polygon(0 0, 100% 0, 50% 60%);
    transform-origin: top; transition: 1s; z-index: 3;
}

.carta {
    position: absolute; width: 260px; height: 140px;
    background: white; top: 30px; left: 20px;
    border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-weight: bold; color: #ec407a;
    z-index: 2; transition: 1s;
}

.envelope.abrir .tampa { transform: rotateX(180deg); }
.envelope.abrir .carta { transform: translateY(-150px); }

/* Timeline e Carrossel */
.data { font-weight: bold; color: #8e24aa; margin-top: 5px; }
.timeline-item { margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
</style>
</head>

<body>

<div class="bg-site" id="fundoSite"></div>
<canvas id="space"></canvas>

<div class="tela-inicial" id="tela">
    <div class="envelope" id="env" onclick="abrirCarta()">
        <div class="tampa"></div>
        <div class="carta">Clique para abrir 💌</div>
    </div>
</div>

<audio id="musica" loop>
    <source src="musica_tema.mp3" type="audio/mpeg">
</audio>

<div class="container" id="conteudo">
    <h2>Feliz 1 ano e 2 meses ❤️</h2>
    <p>Estamos juntos há <span id="contador"></span></p>
    
    <p class="frase">"Desde o dia que te conheci, me senti mais completa."</p>

    <div class="timeline">
        <div class="timeline-item">
            <img src="fotos/foto.jpg">
            <div class="data">19/10/2024</div>
            <p>O dia em que nos conhecemos no Halloween</p>
        </div>
        </div>
</div>

<script>
// Ajustando a data correta do início (Outubro de 2024)
const dataInicio = new Date(2024, 9, 19); 

function atualizarContador() {
    const agora = new Date();
    const diff = agora - dataInicio;
    const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
    // Negrito Roxo solicitado
    document.getElementById("contador").innerHTML = `<strong style="color:#7b1fa2;">${dias} dias</strong>`;
}

function abrirCarta() {
    const env = document.getElementById("env");
    env.classList.add("abrir");
    
    setTimeout(() => {
        // Remove a tela preta e mostra o site
        document.getElementById("tela").style.opacity = "0";
        document.getElementById("fundoSite").style.opacity = "1";
        document.getElementById("conteudo").classList.add("visible");
        
        setTimeout(() => {
            document.getElementById("tela").style.display = "none";
        }, 1500);
        
        document.getElementById("musica").play();
    }, 1200);
}

setInterval(atualizarContador, 1000);
atualizarContador();

// Canvas das estrelas
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let estrelas = [];
for(let i=0; i<150; i++) {
    estrelas.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5});
}
function animar() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = "white";
    estrelas.forEach(e => {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(animar);
}
animar();
</script>

</body>
</html>
