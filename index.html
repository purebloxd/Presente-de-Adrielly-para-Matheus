<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor</title>
    <style>
        body { 
            background-color: #e1bee7; /* Lilás solicitado */
            /* Padrão de fundo com corações e iniciais "A&M" em preto */
            background-image: linear-gradient(0deg, rgba(0,0,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Camada para espalhar as iniciais e corações pretos */
        body::before {
            content: "A&M ❤️ A&M ❤️ A&M ❤️ A&M ❤️ A&M";
            position: fixed;
            font-size: 14px;
            color: rgba(0,0,0,0.2);
            z-index: -1;
            opacity: 0.3;
            width: 200%;
            height: 200%;
            display: flex;
            flex-wrap: wrap;
            top: -50%;
            left: -50%;
            justify-content: space-around;
            transform: rotate(-10deg);
            padding: 50px;
        }

        .container { 
            max-width: 450px; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 25px; 
            border-radius: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            text-align: center; 
            z-index: 10;
        }
        .polaroid { 
            background: white; 
            padding: 10px 10px 35px 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.15); 
            transform: rotate(-2deg); 
            margin-bottom: 25px; 
            border: 1px solid #eee; 
        }
        .polaroid img { 
            width: 100%; 
            border-radius: 5px; 
            height: 350px; 
            object-fit: cover;
            background: #f3e5f5;
        }
        h1 { color: #8e24aa; margin: 10px 0; font-size: 26px; }
        .contador { background: #f3e5f5; padding: 12px; border-radius: 15px; font-weight: bold; color: #7b1fa2; margin: 15px 0; font-size: 1.1rem; }
        .btn-abrir { 
            background: #9c27b0; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 50px; 
            width: 100%; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(156, 39, 176, 0.4);
        }
        .btn-abrir:hover { transform: scale(1.05); background: #7b1fa2; }
        #mensagem-area { 
            display: none; 
            margin-top: 20px; 
            padding: 15px; 
            background: #fdf7ff; 
            border-radius: 15px; 
            border: 1px solid #e1bee7; 
            color: #7b1fa2; 
            font-size: 1.1rem; 
            animation: fadeIn 0.8s; 
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Estilo dos fogos de coração */
        .heart-firework {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 20px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="player" style="position: absolute; top: -1000px;"></div>

    <div class="container">
        <div class="polaroid">
            <img src="image_412a54.jpg" alt="Nossa Foto">
        </div>

        <h1>Feliz 1 ano e 2 meses! ❤️</h1>
        
        <div class="contador">
            Estamos juntos há <span id="dias"></span> dias!
        </div>

        <p style="color: #666; font-size: 0.9rem;">Desde aquele Halloween de 2024, quando nos conhecemos de Coringa e Vampiro, minha vida ficou completa com você, Matheus.</p>

        <button class="btn-abrir" onclick="ativarSurpresa()">Ver Surpresa do Dia & Play ❤️</button>

        <div id="mensagem-area">
            <p id="texto-mensagem"></p>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        const musicaId = '766mI2N-B2o'; // Vanessa da Mata - Ainda Bem

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: musicaId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': musicaId }
            });
        }

        const dataInicio = new Date('2024-10-19');
        const hoje = new Date();
        const diasJuntos = Math.floor((hoje - dataInicio) / (1000 * 60 * 60 * 24));
        document.getElementById('dias').innerText = diasJuntos;

        const mensagens = [
            "Você é o Coringa mais especial que eu poderia encontrar! ❤️",
            "1 ano e 2 meses sendo o casal mais incrível desse mundo.",
            "Obrigada por ser meu parceiro desde aquela primeira festa.",
            "Cada dia com você me faz ter certeza: te escolheria mil vezes.",
            "Ainda bem que te encontrei agora tenho você... ❤️",
            "Você é o meu porto seguro, Matheus. Te amo demais!"
        ];

        function ativarSurpresa() {
            // Tocar música
            if(player && player.playVideo) { player.playVideo(); }
            
            // Mostrar mensagem
            const random = Math.floor(Math.random() * mensagens.length);
            document.getElementById('texto-mensagem').innerText = mensagens[random];
            document.getElementById('mensagem-area').style.display = 'block';
            
            // Explosão de corações
            lancarFogos();
        }

        function lancarFogos() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const h = document.createElement('div');
                    h.className = 'heart-firework';
                    h.innerHTML = i % 2 === 0 ? '❤️' : '💜';
                    const startX = window.innerWidth / 2;
                    const startY = window.innerHeight / 2;
                    h.style.left = startX + 'px';
                    h.style.top = startY + 'px';
                    
                    document.body.appendChild(h);

                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 5 + Math.random() * 10;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    let posX = startX;
                    let posY = startY;
                    let opacity = 1;

                    const move = setInterval(() => {
                        posX += vx;
                        posY += vy;
                        opacity -= 0.02;
                        h.style.left = posX + 'px';
                        h.style.top = posY + 'px';
                        h.style.opacity = opacity;

                        if (opacity <= 0) {
                            clearInterval(move);
                            h.remove();
                        }
                    }, 20);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
