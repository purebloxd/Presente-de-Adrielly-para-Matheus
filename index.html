<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História ❤️</title>

    <style>
        /* O SEU FUNDO ANIMADO ESTÁ AQUI */
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            overflow-x: hidden;
            color: #333;
            background: linear-gradient(270deg, #7b1fa2, #ce93d8, #90caf9, #f48fb1);
            background-size: 800% 800%;
            animation: fundo 18s ease infinite;
        }

        @keyframes fundo {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        /* AS SUAS ESTRELAS */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
            margin-top: 40px;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        img { width: 100%; border-radius: 12px; }

        .btn {
            background: linear-gradient(45deg, #ba68c8, #ec407a);
            border: none;
            padding: 15px;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            width: 80%;
            font-weight: bold;
        }

        #mensagem {
            margin-top: 20px;
            display: none;
            font-weight: bold;
            color: #7b1fa2;
            padding: 15px;
            background: #f3e5f5;
            border-radius: 15px;
        }

        .carrossel-container {
            width: 250px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .carrossel-track {
            display: flex;
            transition: transform .6s ease;
        }

        .carrossel-track img {
            width: 250px;
            height: 350px;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* TELA INICIAL DO ENVELOPE */
        .tela-inicial {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
        }

        .envelope {
            width: 220px;
            height: 140px;
            background: #ec407a;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }

        .tampa {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f06292;
            clip-path: polygon(0 0, 100% 0, 50% 60%);
            transform-origin: top;
            transition: 1s;
            z-index: 3;
        }

        .carta {
            position: absolute;
            width: 180px;
            height: 100px;
            background: white;
            top: 20px;
            left: 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 2;
            transition: 1s;
        }

        .envelope.abrir .tampa { transform: rotateX(180deg); }
        .envelope.abrir .carta { transform: translateY(-100px); }
    </style>
</head>

<body>

    <canvas id="space"></canvas>

    <div class="tela-inicial" id="tela">
        <div class="envelope" id="env" onclick="abrirCarta()">
            <div class="tampa"></div>
            <div class="carta">Abra aqui 💌</div>
        </div>
    </div>

    <audio id="musica" loop>
        <source src="musica_tema.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h2>Feliz 1 ano e 2 meses ❤️</h2>
        <p>Estamos juntos há <span id="contador" style="font-weight: bold; color: #ec407a;"></span></p>

        <div class="carrossel-container">
            <div class="carrossel-track" id="track">
                <img src="fotos/foto.jpg">
                <img src="fotos/foto1.jpg">
                <img src="fotos/foto2.jpg">
                <img src="fotos/foto3.jpg">
                <img src="fotos/foto4.jpg">
                <img src="fotos/foto5.jpg">
                <img src="fotos/foto6.jpg">
                <img src="fotos/foto7.jpg">
            </div>
        </div>
        
        <div style="display:flex; justify-content:center; gap:10px;">
            <button class="btn" style="width:40px;" onclick="voltar()">⬅</button>
            <button class="btn" id="botao">Ver surpresa ❤️</button>
            <button class="btn" style="width:40px;" onclick="proxima()">➡</button>
        </div>

        <div id="mensagem"></div>

        <div style="margin-top:30px;">
            <h3>Nossa Linha do Tempo 💖</h3>
            <p>19/10/2024 - O dia que nos conhecemos no Halloween 🎃</p>
            <p>12/01/2025 - O início de tudo ❤️</p>
            <p>07/03/2025 - Nossa tattoo 🖋️</p>
        </div>
    </div>

    <script>
        // TODAS AS SUAS FUNÇÕES ESTÃO AQUI EMBAIXO
        const inicio = new Date(2025, 0, 12); 
        function atualizarContador() {
            const agora = new Date();
            const diff = agora - inicio;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("contador").innerHTML = dias + " dias";
        }
        setInterval(atualizarContador, 1000);
        atualizarContador();

        function abrirCarta() {
            document.getElementById("env").classList.add("abrir");
            setTimeout(() => {
                document.getElementById("tela").style.display = "none";
                document.getElementById("musica").play();
            }, 1500);
        }

        let atual = 0;
        function proxima() { atual = (atual + 1) % 8; document.getElementById("track").style.transform = `translateX(-${atual * 250}px)`; }
        function voltar() { atual = (atual - 1 + 8) % 8; document.getElementById("track").style.transform = `translateX(-${atual * 250}px)`; }

        let intervaloDigitacao;
        function digitarTexto(texto, elemento) {
            clearInterval(intervaloDigitacao);
            elemento.innerHTML = "";
            let i = 0;
            intervaloDigitacao = setInterval(() => {
                elemento.innerHTML += texto.charAt(i);
                i++;
                if (i >= texto.length) clearInterval(intervaloDigitacao);
            }, 50);
        }

        document.getElementById("botao").onclick = () => {
            const frases = ["Te amo!", "Você é o melhor!", "Didy e Teteu sempre ❤️"];
            digitarTexto(frases[Math.floor(Math.random() * frases.length)], document.getElementById("mensagem"));
            document.getElementById("mensagem").style.display = "block";
        };

        // ESTRELAS NO FUNDO
        const canvas = document.getElementById("space");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let estrelas = [];
        for (let i = 0; i < 100; i++) { estrelas.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5 }); }
        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "white";
            for (let e of estrelas) { ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill(); }
            requestAnimationFrame(animar);
        }
        animar();

        // CORAÇÕES CAINDO
        setInterval(() => {
            const el = document.createElement("div");
            el.innerHTML = "❤️"; el.style.position = "fixed"; el.style.left = Math.random() * window.innerWidth + "px"; el.style.top = "-20px";
            document.body.appendChild(el);
            let y = 0;
            const queda = setInterval(() => { y += 3; el.style.top = y + "px"; if (y > window.innerHeight) { clearInterval(queda); el.remove(); } }, 30);
        }, 1000);
    </script>
</body>
</html>
