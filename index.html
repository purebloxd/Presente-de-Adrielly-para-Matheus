<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa História ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: #333;
            text-align: center;
            overflow-x: hidden;
            background: linear-gradient(270deg, #7b1fa2, #ce93d8, #90caf9, #f48fb1);
            background-size: 800% 800%;
            animation: fundo 18s ease infinite;
        }

        @keyframes fundo {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .container {
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,.3);
        }

        img { width: 100%; border-radius: 10px; }

        .btn {
            background: linear-gradient(45deg, #ba68c8, #ec407a);
            border: none;
            padding: 15px;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }

        #mensagem {
            margin-top: 20px;
            display: none;
            font-weight: bold;
            color: #7b1fa2;
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .carrossel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .carrossel img {
            width: 250px;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }

        .carrossel button {
            background: #ba68c8;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
        }

        .timeline { margin-top: 40px; }
        .timeline-item { margin-bottom: 40px; padding: 10px; border-bottom: 1px dashed #ce93d8; }
        .data { font-weight: bold; color: #8e24aa; margin-top: 10px; font-size: 1.1rem; }

        /* Estilos do Envelope */
        .tela-inicial {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(0,0,0,.8);
            z-index: 100;
        }

        .envelope {
            width: 220px;
            height: 140px;
            background: #ec407a;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }

        .tampa {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f06292;
            clip-path: polygon(0 0, 100% 0, 50% 60%);
            transform-origin: top;
            transition: 1s;
            z-index: 3;
        }

        .carta {
            position: absolute;
            width: 180px;
            height: 100px;
            background: white;
            top: 20px;
            left: 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 2;
            transition: 1s;
        }

        .envelope.abrir .tampa { transform: rotateX(180deg); }
        .envelope.abrir .carta { transform: translateY(-100px); }
    </style>
</head>
<body>

<div class="tela-inicial" id="tela">
    <div class="envelope" id="env" onclick="abrirCarta()">
        <div class="tampa"></div>
        <div class="carta">Abra aqui 💌</div>
    </div>
    <p style="color: white; margin-top: 20px;">Clique no presente para o Matheus</p>
</div>

<audio id="musica" loop>
    <source src="música.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h2>Feliz 1 ano e 2 meses ❤️</h2>
    <p>Estamos juntos há <span id="contador" style="color:#ec407a; font-weight:bold;"></span></p>

    <div class="carrossel">
        <button onclick="voltar()">⬅</button>
        <img id="fotoCarrossel" src="fotos/foto.jpg">
        <button onclick="proxima()">➡</button>
    </div>

    <button class="btn" id="botao" onclick="surpresa()">Ver surpresa ❤️</button>
    <div id="mensagem"></div>

    <div class="timeline">
        <h2>Nossa História 💖</h2>
        
        <div class="timeline-item">
            <img src="fotos/foto.jpg">
            <div class="data">19/10/2024</div>
            <p>Nos conhecemos no Halloween 🎃</p>
        </div>

        <div class="timeline-item">
            <img src="fotos/foto1.jpg">
            <div class="data">12/01/2025</div>
            <p>O dia que oficialmente começamos nossa história ❤️</p>
        </div>

        <div class="timeline-item">
            <img src="fotos/foto2.jpg">
            <div class="data">07/03/2025</div>
            <p>Nos eternizamos na pele 🖋️</p>
        </div>

        <div class="timeline-item">
            <img src="fotos/foto3.jpg">
            <div class="data">26/04/2025</div>
            <p>Nossa visita ao castelo 🏰</p>
        </div>
    </div>
</div>

<script>
    // 1. AJUSTE DO CONTADOR (Data oficial: 12/01/2025)
    // Mês 0 = Janeiro no JavaScript
    const dataInicio = new Date(2025, 0, 12); 

    function atualizarContador() {
        const agora = new Date();
        const diff = agora - dataInicio;
        const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("contador").innerHTML = dias + " dias";
    }
    setInterval(atualizarContador, 1000);
    atualizarContador();

    // 2. FUNÇÃO DA MÚSICA E ENVELOPE
    function abrirCarta() {
        const env = document.getElementById("env");
        env.classList.add("abrir");
        setTimeout(() => {
            document.getElementById("tela").style.display = "none";
            const som = document.getElementById("musica");
            som.volume = 0.5;
            som.play().catch(e => console.log("Áudio aguardando interação"));
        }, 1500);
    }

    // 3. CARROSSEL DE FOTOS (Usando sua pasta /fotos)
    const fotos = [
        "fotos/foto.jpg",
        "fotos/foto1.jpg",
        "fotos/foto2.jpg",
        "fotos/foto3.jpg",
        "fotos/foto4.jpg",
        "fotos/foto5.jpg",
        "fotos/foto6.jpg",
        "fotos/foto7.jpg"
    ];
    let atual = 0;

    function proxima() {
        atual = (atual + 1) % fotos.length;
        document.getElementById("fotoCarrossel").src = fotos[atual];
    }

    function voltar() {
        atual = (atual - 1 + fotos.length) % fotos.length;
        document.getElementById("fotoCarrossel").src = fotos[atual];
    }

    // 4. FRASES DA SURPRESA (CORRIGIDAS)
    const frases = [
        "Didy e Teteu, Teteu e Didy ❤️",
        "Com você tudo fica mais bonito.",
        "Você é meu lugar favorito.",
        "Eu escolheria você mil vezes.",
        "Nosso amor é minha parte favorita da vida.",
        "Amar você é a coisa mais fácil que já fiz.",
        "Obrigada por fazer minha vida mais feliz."
    ];

    function surpresa() {
        const fraseAleatoria = frases[Math.floor(Math.random() * frases.length)];
        const caixa = document.getElementById("mensagem");
        caixa.innerText = fraseAleatoria; // Texto limpo sem erros
        caixa.style.display = "block";
        
        // Garante que a música toque ao interagir com o botão
        document.getElementById("musica").play();
    }
</script>

</body>
</html>
