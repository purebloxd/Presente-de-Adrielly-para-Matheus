<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossa História ❤️</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
text-align:center;
overflow-x:hidden;
color:#333;
background:linear-gradient(270deg,#7b1fa2,#ce93d8,#90caf9,#f48fb1);
background-size:800% 800%;
animation:fundo 18s ease infinite;
}

@keyframes fundo{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

canvas{
position:fixed;
top:0;
left:0;
z-index:1; /* Estrelas no fundo */
}

.container{
position: relative;
z-index: 10; /* Conteúdo garantido na frente das estrelas */
max-width:450px;
margin:auto;
padding:20px;
background:white;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
margin-top:40px;
display: block;
}

img{
width:100%;
border-radius:12px;
}

.frase{
margin-top:10px;
font-style:italic;
color:#7b1fa2;
}

.btn{
background:linear-gradient(45deg,#ba68c8,#ec407a);
border:none;
padding:15px;
border-radius:40px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

#mensagem{
margin-top:20px;
display:none;
font-weight:bold;
color:#7b1fa2;
min-height:40px;
}

.carrossel{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin:20px 0;
}

.carrossel-container{
width:250px;
overflow:hidden;
border-radius:12px;
}

.carrossel-track{
display:flex;
transition:transform .6s ease;
}

.carrossel-track img{
width:250px;
flex-shrink:0;
}

.timeline{
margin-top:40px;
}

.timeline-item{
margin-bottom:40px;
}

.timeline-item img{
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.data{
font-weight:bold;
color:#8e24aa;
margin-top:10px;
}

/* TELA DE BLOQUEIO TOTAL - CORRIGIDA */
.tela-inicial{
position:fixed;
top: 0;
left: 0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:#000000; 
z-index:9999; /* Sempre no topo até ser removida */
opacity: 1;
transition: opacity 1.5s ease;
}

.envelope{
width:320px; 
height:220px; 
background:#ec407a;
border-radius:15px;
position:relative;
cursor:pointer;
box-shadow: 0 0 50px rgba(236, 64, 122, 0.5);
}

.tampa{
position:absolute;
width:100%;
height:100%;
background:#f06292;
clip-path:polygon(0 0,100% 0,50% 60%);
transform-origin:top;
transition:1s;
z-index:3;
}

.carta{
position:absolute;
width:280px; 
height:160px; 
background:white;
top:30px;
left:20px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size: 1.3rem;
z-index:2;
transition: 1.2s;
color: #ec407a;
}

.envelope.abrir .tampa{
transform:rotateX(180deg);
}

.envelope.abrir .carta{
transform:translateY(-180px);
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="tela-inicial" id="tela">
<div class="envelope" id="env" onclick="abrirCarta()">
<div class="tampa"></div>
<div class="carta">Clique para abrir 💌</div>
</div>
</div>

<audio id="musica" loop>
<source src="musica_tema.mp3" type="audio/mpeg">
</audio>

É um privilégio viver com você, te amo!
</p>
