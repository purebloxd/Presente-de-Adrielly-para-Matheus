<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o Meu Amor</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow-x:hidden;

background:linear-gradient(-45deg,#e1bee7,#ce93d8,#ba68c8,#ab47bc);
background-size:400% 400%;
animation:fundo 12s ease infinite;
}

@keyframes fundo{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:450px;
width:90%;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
text-align:center;
position:relative;
z-index:2;
}

.polaroid{
background:white;
padding:10px 10px 35px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transform:rotate(-2deg);
margin-bottom:20px;
}

.polaroid img{
width:100%;
border-radius:5px;
max-height:380px;
object-fit:cover;
}

.btn{
background:#9c27b0;
color:white;
border:none;
padding:16px;
border-radius:50px;
width:100%;
font-weight:bold;
cursor:pointer;
font-size:1.1rem;
transition:.25s;
box-shadow:0 4px 15px rgba(156,39,176,0.4);
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 8px 25px rgba(156,39,176,0.6);
}

#mensagem{
display:none;
margin-top:20px;
padding:15px;
background:#fdf7ff;
border-radius:15px;
border:1px solid #e1bee7;
color:#7b1fa2;
}

.coracao{
position:fixed;
font-size:22px;
pointer-events:none;
z-index:1;
}

.tela-inicial{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#ab47bc;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:10;
}

</style>
</head>

<body>

<div class="tela-inicial" id="tela">
<h1>💌 Uma surpresa pra você</h1>
<button class="btn" onclick="abrirSite()">Abrir</button>
</div>

<audio id="musica" preload="auto" loop>
<source src="./musica.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div class="polaroid">
<img src="./foto.jpg">
</div>

<h2 style="color:#8e24aa">Feliz 1 ano e 2 meses ❤️</h2>

<p style="font-weight:bold;color:#7b1fa2">
Estamos juntos há <span id="dias"></span> dias
</p>

<p style="color:#555">
Desde aquele Halloween de 2024, quando nos conhecemos,
minha vida ficou completa com você.
</p>

<button class="btn" onclick="surpresa()">Ver surpresa ❤️</button>

<div id="mensagem"></div>

</div>

<script>

const inicio=new Date("2025-01-12");
const hoje=new Date();

const dias=Math.floor((hoje-inicio)/(1000*60*60*24));
document.getElementById("dias").innerText=dias;

const frases=[
"Didy e Teteu, Teteu e Didy ❤️",
"1 ano e 2 meses sendo o casal mais incrível do mundo.",
"Obrigada por ser meu parceiro desde aquela festa.",
"Ainda bem que te encontrei agora tenho você ❤️",
"Você é meu porto seguro."
];

function abrirSite(){

document.getElementById("tela").style.display="none";

const musica=document.getElementById("musica");

musica.currentTime=0;
musica.play().catch(()=>{});

}

function surpresa(){

const frase=frases[Math.floor(Math.random()*frases.length)];

const caixa=document.getElementById("mensagem");

caixa.innerText=frase;

caixa.style.display="block";

for(let i=0;i<40;i++){

criarCoracao();

}

}

function criarCoracao(){

const h=document.createElement("div");

h.className="coracao";

h.innerHTML=Math.random()>0.5?"❤️":"💜";

document.body.appendChild(h);

let x=window.innerWidth/2;
let y=window.innerHeight/2;

h.style.left=x+"px";
h.style.top=y+"px";

let angulo=Math.random()*Math.PI*2;
let velocidade=5+Math.random()*10;

let vx=Math.cos(angulo)*velocidade;
let vy=Math.sin(angulo)*velocidade;

let op=1;

const loop=setInterval(()=>{

x+=vx;
y+=vy;

vy+=0.4;

op-=0.02;

h.style.left=x+"px";
h.style.top=y+"px";
h.style.opacity=op;

if(op<=0){

clearInterval(loop);
h.remove();

}

},25);

}

setInterval(()=>{

criarCoracao();

},1200);

</script>

</body>
</html>
