<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor</title>
    <style>
        body { background-color: #fce4ec; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .container { max-width: 450px; width: 100%; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .polaroid { background: white; padding: 10px 10px 35px 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); transform: rotate(-2deg); margin-bottom: 25px; border: 1px solid #eee; }
        .polaroid img { width: 100%; border-radius: 5px; height: 350px; object-fit: cover; }
        h1 { color: #d81b60; margin: 10px 0; font-size: 26px; }
        .contador { background: #fce4ec; padding: 12px; border-radius: 15px; font-weight: bold; color: #ad1457; margin: 15px 0; font-size: 1.1rem; }
        .btn-abrir { background: #d81b60; color: white; border: none; padding: 16px; border-radius: 50px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-abrir:hover { transform: scale(1.02); background: #c2185b; }
        #mensagem-area { display: none; margin-top: 20px; padding: 15px; background: #fff5f8; border-radius: 15px; border: 1px solid #f8bbd0; color: #ad1457; font-size: 1.1rem; animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .heart { position: fixed; color: #ff4b6e; font-size: 20px; animation: float 4s linear infinite; z-index: 1000; }
        @keyframes float { 0% { transform: translateY(100vh); opacity: 1; } 100% { transform: translateY(-10vh); opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="polaroid">
            <img src="https://images.unsplash.com/photo-1518199266791-739d6ff26ef5?q=80&w=1000&auto=format&fit=crop" alt="Nossa Foto">
        </div>

        <h1>Feliz 1 ano e 2 meses! ❤️</h1>
        
        <div class="contador">
            Estamos juntos há <span id="dias"></span> dias!
        </div>

        <p style="color: #666;">Desde aquele Halloween de 2024, quando nos conhecemos de Coringa e Vampiro, minha vida ficou completa com você, Matheus.</p>

        <button class="btn-abrir" onclick="gerarMensagem()">Ver Surpresa do Dia</button>

        <div id="mensagem-area">
            <p id="texto-mensagem"></p>
        </div>
    </div>

    <script>
        // Cálculo automático dos dias
        const dataInicio = new Date('2024-10-19');
        const hoje = new Date();
        const diferenca = hoje - dataInicio;
        const diasJuntos = Math.floor(diferenca / (1000 * 60 * 60 * 24));
        document.getElementById('dias').innerText = diasJuntos;

        const mensagens = [
            "Você é o Coringa mais especial que eu poderia encontrar! ❤️",
            "1 ano e 2 meses sendo o casal mais incrível desse mundo.",
            "Obrigada por ser meu parceiro desde aquela primeira festa.",
            "Cada dia com você me faz ter certeza: te escolheria mil vezes.",
            "Feliz nosso dia! Que venham muitos outros meses ao seu lado.",
            "Você é o meu porto seguro, Matheus. Te amo demais!"
        ];

        function gerarMensagem() {
            const random = Math.floor(Math.random() * mensagens.length);
            document.getElementById('texto-mensagem').innerText = mensagens[random];
            document.getElementById('mensagem-area').style.display = 'block';
            criarCoracoes();
        }

        function criarCoracoes() {
            for(let i=0; i<20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
