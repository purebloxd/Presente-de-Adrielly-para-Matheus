<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o Meu Amor</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;

background:linear-gradient(270deg,#7b1fa2,#ce93d8,#90caf9,#f48fb1);
background-size:800% 800%;
animation:fundo 20s ease infinite;
}

@keyframes fundo{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
max-width:420px;
width:90%;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,0.3);
text-align:center;
z-index:2;
}

.polaroid{
background:white;
padding:10px 10px 35px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transform:rotate(-2deg);
margin-bottom:20px;
}

.polaroid img{
width:100%;
border-radius:5px;
max-height:380px;
object-fit:cover;
}

.btn{
background:linear-gradient(45deg,#ba68c8,#ec407a);
color:white;
border:none;
padding:16px;
border-radius:40px;
width:100%;
font-weight:bold;
cursor:pointer;
font-size:1.1rem;
transition:.3s;
}

.btn:hover{
transform:scale(1.1);
}

#mensagem{
display:none;
margin-top:20px;
padding:15px;
background:#fdf7ff;
border-radius:15px;
border:1px solid #e1bee7;
color:#7b1fa2;
}

.particula{
position:fixed;
pointer-events:none;
z-index:1;
font-size:22px;
animation:girar 4s linear infinite;
}

@keyframes girar{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}

.estrela{
animation:brilhar 2s infinite alternate;
}

@keyframes brilhar{
from{opacity:.3}
to{opacity:1}
}

.tela-inicial{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(8px);
z-index:10;
}

/* ENVELOPE */

.envelope{
width:220px;
height:140px;
background:#ec407a;
border-radius:10px;
position:relative;
cursor:pointer;
}

.tampa{
position:absolute;
width:100%;
height:100%;
background:#f06292;
clip-path:polygon(0 0,100% 0,50% 60%);
transform-origin:top;
transition:1s;
}

.carta{
position:absolute;
width:200px;
height:120px;
background:white;
top:20px;
left:10px;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
color:#7b1fa2;
transform:translateY(60px);
transition:1s;
}

.envelope.abrir .tampa{
transform:rotateX(180deg);
}

.envelope.abrir .carta{
transform:translateY(-120px);
}

.texto-envelope{
margin-top:20px;
color:white;
font-size:20px;
}

/* CONSTELAÇÃO */

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* CORAÇÕES ENCONTRO */

.coracao-encontro{
position:fixed;
font-size:30px;
z-index:1;
}

</style>
</head>

<body>

<canvas id="constelacao"></canvas>

<div class="tela-inicial" id="tela">

<div class="envelope" onclick="abrirSite()" id="env">
<div class="tampa"></div>
<div class="carta">Para você ❤️</div>
</div>

<div class="texto-envelope">Abrir carta</div>

</div>

<audio id="musica" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div class="polaroid">
<img src="foto.jpg">
</div>

<h2 style="color:#8e24aa">Feliz 1 ano e 2 meses ❤️</h2>

<p style="font-weight:bold;color:#7b1fa2">
Estamos juntos há <span id="contador"></span> ❤️
</p>

<p style="color:#555">
Desde aquele Halloween de 2024 quando nos conhecemos,
minha vida ficou muito mais bonita com você.
</p>

<button class="btn" onclick="surpresa()">Ver surpresa ❤️</button>

<div id="mensagem"></div>

</div>

<script>

/* CONTADOR */

const inicio=new Date("2025-01-12");

function atualizarContador(){
const agora=new Date();
const diff=agora-inicio;
const dias=Math.floor(diff/(1000*60*60*24));
document.getElementById("contador").innerHTML=`${dias} dias`;
}

setInterval(atualizarContador,1000);
atualizarContador();

/* FRASES */

const frases=[
"Didy e Teteu, Teteu e Didy ❤️",
"Com você tudo fica mais bonito.",
"Você é meu lugar favorito.",
"Eu escolheria você mil vezes.",
"Nosso amor é minha parte favorita.",
"Você é minha pessoa favorita.",
"Cada segundo com você vale a pena."
"Nosso amor é minha parte favorita da vida.",
"Amar você é a coisa mais fácil que já fiz.",
"Obrigada por fazer minha vida mais feliz.",
"Você transforma qualquer momento em memória.",
"Eu escolheria você em todas as vidas.",
"Nosso amor é a melhor coincidência da minha vida.",
"Você é meu sorriso favorito.",
"Meu coração sempre encontra o seu.",
"Você é a melhor parte dos meus dias.",
"Com você tudo faz sentido.",
"Meu mundo ficou mais bonito depois que você chegou.",
"Você é minha pessoa favorita.",
"Nosso amor merece mil comemorações.",
"Eu amo a vida que tenho com você.",
"Obrigada por ser exatamente quem você é.",
"Cada segundo com você vale a pena.",
"Eu amo nós dois."
];

/* ABRIR ENVELOPE */

function abrirSite(){

document.getElementById("env").classList.add("abrir");

setTimeout(()=>{
document.getElementById("tela").style.display="none";
document.getElementById("musica").play().catch(()=>{});
},1500);

}

/* SURPRESA */

function surpresa(){

const frase=frases[Math.floor(Math.random()*frases.length)];

const caixa=document.getElementById("mensagem");

caixa.innerText=frase;
caixa.style.display="block";

explodirAmor();
}

/* EXPLOSÃO */

function explodirAmor(){

for(let i=0;i<150;i++){

const p=document.createElement("div");

p.className="particula";
p.innerHTML=Math.random()>0.5?"❤️":"💜";

document.body.appendChild(p);

let ang=Math.random()*Math.PI*2;
let vel=5+Math.random()*15;

let x=window.innerWidth/2;
let y=window.innerHeight/2;

let vx=Math.cos(ang)*vel;
let vy=Math.sin(ang)*vel;

let op=1;

const loop=setInterval(()=>{

x+=vx;
y+=vy;
vy+=0.4;
op-=0.02;

p.style.left=x+"px";
p.style.top=y+"px";
p.style.opacity=op;

if(op<=0){
clearInterval(loop);
p.remove();
}

},25);
}
}

/* PARTICULAS CAINDO */

function criarParticula(){

const tipos=["❤️","💜","⭐"];

const p=document.createElement("div");
p.className="particula";

const tipo=tipos[Math.floor(Math.random()*tipos.length)];
p.innerHTML=tipo;

if(tipo==="⭐") p.classList.add("estrela");

document.body.appendChild(p);

let x=Math.random()*window.innerWidth;
let y=-20;

p.style.left=x+"px";
p.style.top=y+"px";

let vel=2+Math.random()*3;

const loop=setInterval(()=>{

y+=vel;
p.style.top=y+"px";

if(y>window.innerHeight){
clearInterval(loop);
p.remove();
}

},25);

}

setInterval(criarParticula,700);

/* CORAÇÕES QUE SE ENCONTRAM */

function coracoesEncontro(){

const c1=document.createElement("div");
const c2=document.createElement("div");

c1.innerHTML="💜";
c2.innerHTML="❤️";

c1.className="coracao-encontro";
c2.className="coracao-encontro";

document.body.appendChild(c1);
document.body.appendChild(c2);

let x1=0;
let x2=window.innerWidth;

let y=window.innerHeight/2;

const loop=setInterval(()=>{

x1+=5;
x2-=5;

c1.style.left=x1+"px";
c1.style.top=y+"px";

c2.style.left=x2+"px";
c2.style.top=y+"px";

if(x2-x1<40){

c1.innerHTML="💖";
c2.remove();

setTimeout(()=>c1.remove(),2000);

clearInterval(loop);

}

},30);

}

setInterval(coracoesEncontro,12000);

/* CONSTELAÇÃO */

const canvas=document.getElementById("constelacao");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let estrelas=[];

for(let i=0;i<80;i++){
estrelas.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height
});
}

function desenhar(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<estrelas.length;i++){

for(let j=i+1;j<estrelas.length;j++){

let dx=estrelas[i].x-estrelas[j].x;
let dy=estrelas[i].y-estrelas[j].y;
let dist=Math.sqrt(dx*dx+dy*dy);

if(dist<120){

ctx.strokeStyle="rgba(255,255,255,0.2)";
ctx.beginPath();
ctx.moveTo(estrelas[i].x,estrelas[i].y);
ctx.lineTo(estrelas[j].x,estrelas[j].y);
ctx.stroke();

}

}

}

requestAnimationFrame(desenhar);

}

desenhar();

</script>

</body>
</html>
